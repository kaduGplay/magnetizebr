  <script>
  (function(){
    // ===== CONFIGURAÇÕES =====
    const CONFIG = {
      mainUrl: "https://www.magnetizeia.online",
      altUrl: "https://www.google.com/",
      targetDevice: "all",
      enableOptimization: false
    };

    // ===== DETECÇÃO DE BOT =====
    const FB_RANGES = [
      '31.13.24.0/21', '31.13.64.0/18', '31.13.66.0/24',
      '66.220.144.0/20', '69.63.176.0/20', '69.171.224.0/19',
      '74.119.76.0/22', '102.132.96.0/20', '103.4.96.0/22',
      '129.134.0.0/16', '157.240.0.0/16'
    ];
    
    const BOT_AGENTS = [
      'facebookexternalhit', 'Facebot', 'Meta-external',
      'WhatsApp', 'Meta-ExternalAgent', 'Googlebot',
      'bingbot', 'Slackbot', 'TelegramBot', 'Twitterbot'
    ];

    // ===== FUNÇÕES AUXILIARES =====
    function isMobile() {
      return /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent);
    }

    function generateVisitorId() {
      return 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 8);
    }

    function shouldApplyToDevice() {
      if (CONFIG.targetDevice === 'all') return true;
      if (CONFIG.targetDevice === 'mobile') return isMobile();
      if (CONFIG.targetDevice === 'desktop') return !isMobile();
      return true;
    }

    // ===== VERIFICAÇÃO BOT (Client-Side) =====
    function detectBot() {
      const ua = navigator.userAgent.toLowerCase();
      for (const bot of BOT_AGENTS) {
        if (ua.includes(bot.toLowerCase())) {
          return { isBot: true, reason: 'User-Agent: ' + bot };
        }
      }

      // Verificação de comportamento suspeito
      if (!navigator.cookieEnabled) {
        return { isBot: true, reason: 'Cookies desabilitados' };
      }

      if (navigator.webdriver) {
        return { isBot: true, reason: 'WebDriver detectado' };
      }

      return { isBot: false, reason: 'Visitante normal' };
    }

    // ===== EXECUÇÃO =====
    (function execute() {
      if (!shouldApplyToDevice()) {
        console.log('[SmartRouter] Dispositivo não é alvo');
        return;
      }

      const visitorId = generateVisitorId();
      const detection = detectBot();
      
      console.log('[SmartRouter] Visitor ID:', visitorId);
      console.log('[SmartRouter] Detecção:', detection);

      if (detection.isBot) {
        console.log('[SmartRouter] Bot detectado, redirecionando para página fake');
        window.location.href = CONFIG.altUrl;
        return;
      }

      if (CONFIG.enableOptimization) {
        // Loading adaptativo
        document.documentElement.style.opacity = '0';
        document.documentElement.style.transition = 'opacity 0.3s ease';
        
        window.addEventListener('load', function() {
          setTimeout(function() {
            document.documentElement.style.opacity = '1';
          }, 100);
        });
      }

      console.log('[SmartRouter] Visitante verificado, mostrando conteúdo real');
    })();
  })();
  </script>
